name: radar # Sin esto Compose usa el nombre de la carpeta, y renombrarla rompe los volúmenes

services:

  postgres:
    image: postgres:16-alpine
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Postgres solo lo ejecuta cuando el volumen está vacío

    networks:
      - radar_net

    # FastAPI corre alembic al arrancar, así que no puede encenderse antes de que Postgres acepte conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: ./fastapi
    command: sh -c "alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    container_name: radar_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GROQ_MODELO_VOZ: ${GROQ_MODELO_VOZ}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USUARIO: ${ADMIN_USUARIO}
      ADMIN_CLAVE: ${ADMIN_CLAVE}
    networks:
      - radar_net
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./fastapi:/app # Solo para desarrollo: en un servidor esto se quita

  n8n:
    image: n8nio/n8n:2.37.7 # Fija en la versión que quedó probada; en latest se actualizó sola y rompió el entorno
    container_name: radar_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB} # Base aparte para que los flujos de n8n no se mezclen con las tablas de negocio
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DEFAULT_LOCALE: es
      GENERIC_TIMEZONE: "America/Bogota"
      N8N_HIDE_USAGE_PAGE: "true"
      N8N_ATTRIBUTION: "false"
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: ${WEBHOOK_URL} # URL pública del túnel, la que Telegram necesita para entregar los mensajes
    volumes:
      - n8n_data:/home/node/.n8n # Aquí vive la clave con la que n8n cifra las credenciales; si se pierde, se pierden

    networks:
      - radar_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  radar_net:
    name: radar_net # Explícito para que Compose no le anteponga el nombre del proyecto
    driver: bridge

volumes:
  postgres_data:
    name: radar_postgres_data # Explícito para que renombrar la carpeta no vuelva a romper la persistencia
  n8n_data:
    name: radar_n8n_data
