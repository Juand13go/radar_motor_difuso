<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tornalba Suministros Técnicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/comun.css">
    <link rel="stylesheet" href="/static/cliente.css">
    <script src="/static/comun.js" defer></script>
    <script src="/static/cliente.js" defer></script>
</head>
<body>
    <!-- Aviso de exito o error: arranca vacio y oculto, lo llena mostrarAviso en comun.js -->
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

    <!-- Barra superior: solo la distribuidora y sin navegacion, porque esta pagina es la que ve el cliente -->
    <nav class="navbar">
        <div class="encabezado">
            <div class="encabezado__cliente">
                <img src="/static/tornalba.png" alt="Tornalba Suministros Técnicos S.A.S." class="encabezado__logo-cliente">
                <div>
                    <p class="encabezado__nombre">Tornalba Suministros Técnicos S.A.S.</p>
                    <p class="encabezado__bajada">Distribuidora de suministros industriales y ferretería técnica</p>
                </div>
            </div>
        </div>
        <div class="navbar__linea">
            <hr>
            <div class="puntos">
                <span class="punto punto--claro"></span>
                <span class="punto punto--medio"></span>
                <span class="punto punto--oscuro"></span>
            </div>
        </div>
    </nav>

    <main class="contenido">

        <!-- Chat del cliente, solo con su propia conversacion -->
        <section class="chat-cliente">
            <ul id="conversacionCliente" class="chat-cliente__conversacion"></ul>

            <div class="chat-cliente__controles">
                <input type="text" id="inputClienteNombre" class="campo chat-cliente__campo" placeholder="Su nombre o el de su empresa (opcional)" maxlength="80" autocomplete="off" enterkeyhint="next">
                <input type="tel" id="inputClienteTelefono" class="campo chat-cliente__campo" placeholder="Su celular (WhatsApp)" maxlength="20" inputmode="numeric" autocomplete="tel" enterkeyhint="next">
                <p id="textoAutorizacionCliente" class="chat-cliente__autorizacion">Al enviar su mensaje autoriza a Tornalba Suministros Técnicos a contactarlo por WhatsApp sobre esta solicitud.</p>
                <div class="chat-cliente__fila">
                    <input type="text" id="inputClienteTexto" class="campo chat-cliente__campo" placeholder="Escriba su mensaje" maxlength="1000" autocomplete="off" enterkeyhint="send">
                    <button id="btnEnviarCliente" class="boton boton--primario">Enviar</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Sin la marca de Halua: el cliente le compra a Tornalba y no le interesa quien hizo el software -->
    <footer class="pie">
        <small>Tornalba Suministros Técnicos S.A.S.</small>
        <small>Medellín, Colombia</small>
    </footer>

</body>
</html>
