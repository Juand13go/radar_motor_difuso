<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar · Panel de asesores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <!-- Barra superior: logo chico, linea divisoria y los tres puntos -->
    <nav class="navbar">
        <div class="navbar__marca">
            <img src="/static/Halua.png" alt="Halua Studio" class="navbar__logo">
        </div>
        <div class="navbar__linea">
            <hr>
            <div class="puntos">
                <span class="punto punto--claro"></span>
                <span class="punto punto--medio"></span>
                <span class="punto punto--oscuro"></span>
            </div>
        </div>
    </nav>

    <main class="contenido">

        <!-- Portada: titular grande partido en dos, igual que la web de Halua 
        <section class="portada">
            <div class="portada__titulo">
                <h2 class="titular">PANEL DE</h2>
                <h2 class="titular titular--acento">ASESORES.</h2>
                <hr class="regla-larga">
                <h1 class="subtitular">Radar, triaje de leads comerciales</h1>
            </div>

            <div class="portada__texto">
                <p class="parrafo">
                    Cada solicitud que entra por los canales de la empresa se interpreta, se clasifica y se enruta al asesor que corresponde.
                </p>
                <p class="parrafo parrafo--medio">
                    El asesor no abre doscientos mensajes: abre los leads que ya vienen con la informacion organizada.
                </p>
                <p class="parrafo parrafo--claro">
                    Y cuando cierra, deja registro de si fue venta o no. Cada decision del sistema queda ligada a un resultado real.
                </p>
            </div>
        </section>
        -->
        

        <!-- Bloque 1: listado de asesores -->
        <section class="bloque">
            <div class="bloque__encabezado">
                <h3 class="bloque__titulo">Asesores</h3>
                <p class="bloque__ayuda">Consulta los asesores registrados y copia el identificador del que quieras revisar.</p>
            </div>

            <div class="controles">
                <button id="btnListarAsesores" class="boton boton--primario">Listar asesores</button>
            </div>

            <ul id="contenedorAsesores" class="lista"></ul>
        </section>

        <!-- Bloque 2: leads asignados a un asesor -->
        <section class="bloque">
            <div class="bloque__encabezado">
                <h3 class="bloque__titulo">Leads asignados</h3>
                <p class="bloque__ayuda">Ingresa el identificador de un asesor para ver los leads que tiene a cargo.</p>
            </div>

            <div class="controles">
                <div class="controles__fila">
                    <input type="text" id="inputAsesorId" class="campo" placeholder="UUID del asesor" autocomplete="off">
                    <button id="btnBuscarLeads" class="boton boton--primario">Buscar</button>
                </div>
            </div>

            <ul id="contenedorLeads" class="lista"></ul>
        </section>

    </main>

    <footer class="pie">
        <small>Medellin, Col.</small>

        <div class="circulos">
            <span class="circulo circulo--violeta"></span>
            <span class="circulo circulo--naranja"></span>
            <span class="circulo circulo--cian"></span>
            <span></span>
            <span class="circulo circulo--cuadrado"></span>
        </div>

        <small>Radar, un producto de Halua.Studio</small>
    </footer> 

</body>
</html>
