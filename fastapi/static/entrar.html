<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar · Entrar al backoffice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/comun.css">
    <link rel="stylesheet" href="/static/entrar.css">
    <script src="/static/entrar.js" defer></script>
</head>
<body>

    <!-- Sin menu lateral porque todavia no hay sesion: solo la tarjeta centrada y la firma debajo -->
    <main class="entrar">

        <section class="tarjeta tarjeta-entrar">
            <p class="tarjeta-entrar__marca"><span>Radar<span class="punto-final">.</span></span><img src="/static/tornalba.png" alt="" class="tarjeta-entrar__logo"></p>
            <h1 class="tarjeta-entrar__titulo">Entrar al backoffice</h1>

            <form id="formEntrar" class="tarjeta-entrar__formulario">
                <div class="tarjeta-entrar__grupo">
                    <label for="usuarioEntrar" class="tarjeta-entrar__etiqueta">Usuario</label>
                    <input id="usuarioEntrar" class="campo" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="tarjeta-entrar__grupo">
                    <label for="claveEntrar" class="tarjeta-entrar__etiqueta">Clave</label>
                    <input id="claveEntrar" class="campo" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="btnEntrar" class="boton boton--primario">Entrar</button>
            </form>

            <p id="mensajeError" class="tarjeta-entrar__error" role="alert"></p>
        </section>

        <div class="firma-entrar">
            <img src="/static/Halua.png" alt="" class="firma-entrar__logo">
            <span>Radar, de Halua Studio</span>
            <span class="firma-entrar__puntos" aria-hidden="true">
                <span class="firma-entrar__punto firma-entrar__punto--acento"></span>
                <span class="firma-entrar__punto firma-entrar__punto--naranja"></span>
                <span class="firma-entrar__punto firma-entrar__punto--cian"></span>
            </span>
        </div>

    </main>

</body>
</html>
